    <style>
        :root {
            --primary: #15803d; 
            --bg-color: #f8fafc;
            --radius: 14px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg-color); 
            padding: 16px; 
            height: 100vh; 
            display: flex;
            flex-direction: column;
            overflow-y: auto; 
        }

        .container { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            max-width: 500px; 
            margin: 0 auto; 
            width: 100%;
        }

        /* Header */
        .header { 
            background: var(--primary); 
            color: white; 
            padding: 12px 16px; 
            border-radius: var(--radius); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
        }
        .header h1 { font-size: 1.2rem; font-weight: 700; }
        .header span { font-size: 0.8rem; opacity: 0.9; margin-left: 6px; font-weight: 400; }

        /* Grid System */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        .card { 
            background: white; 
            border: 1px solid #e2e8f0; 
            border-radius: var(--radius); 
            padding: 8px 12px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center;
            box-shadow: var(--shadow);
        }
        
        .label { 
            font-size: 0.7rem; 
            font-weight: 700; 
            color: #64748b; 
            white-space: nowrap; 
            margin-bottom: 2px;
            text-transform: uppercase;
        }
        
        .input-val { 
            font-size: 1.2rem; 
            font-weight: 700; 
            color: #1e293b; 
            border: none; 
            outline: none; 
            width: 100%; 
            background: transparent; 
            padding: 0;
        }
        .input-val::placeholder { color: #cbd5e1; font-weight: 400; }

        /* Colors */
        .c-green { background: #f0fdf4; border-color: #dcfce7; } .c-green .input-val { color: #166534; } .c-green .label { color: #166534; opacity: 0.7; }
        .c-orange { background: #fff7ed; border-color: #ffedd5; } .c-orange .label { color: #9a3412; opacity: 0.7; }
        .c-yellow { background: #fefce8; border-color: #fef9c3; } .c-yellow .input-val { color: #854d0e; } .c-yellow .label { color: #854d0e; opacity: 0.7; }
        .c-purple { background: #faf5ff; border-color: #f3e8ff; } .c-purple .label { color: #6b21a8; opacity: 0.7; }

        /* Dimension Boxes */
        .dims-wrapper { display: flex; flex-direction: column; gap: 6px; }

        .dim-box { 
            background: white; 
            border-radius: var(--radius); 
            border: 1px solid #e2e8f0; 
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        .dim-header { 
            background: #eef2ff; 
            padding: 5px 12px; 
            font-size: 0.75rem; 
            font-weight: 700; 
            color: #4338ca; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }
        .dim-row { padding: 8px 12px; display: flex; align-items: center; gap: 8px; }
        .dim-col { flex: 1; }
        .dim-col label { display: block; font-size: 0.6rem; color: #64748b; font-weight: 700; margin-left: 2px; margin-bottom: 2px; }
        .dim-input { 
            width: 100%; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 6px; font-size: 1.1rem; font-weight: 600; text-align: center; outline: none;
        }
        .dim-input:focus { background: white; border-color: #6366f1; }
        .x-sym { color: #94a3b8; font-size: 1.1rem; margin-top: 10px; }
        .blue-theme .dim-header { background: #eff6ff; color: #1e40af; }
        .blue-theme .dim-input:focus { border-color: #3b82f6; }

        /* Reset Button */
        .btn-reset { 
            background: #ef4444; color: white; border: none; padding: 12px; border-radius: var(--radius); font-size: 1rem; font-weight: 700; cursor: pointer; box-shadow: 0 2px 4px rgba(239, 68, 68, 0.2); margin-top: 8px; width: 100%;
        }

        /* Footer */
        .footer {
            margin-top: 20px; margin-bottom: 10px; text-align: center; padding: 15px; background: white; border: 1px solid #e2e8f0; border-radius: var(--radius); box-shadow: var(--shadow); width: 100%;
        }
        .footer .name { font-weight: 800; color: #1e293b; font-size: 1.1rem; margin-bottom: 4px; display: block; }
        .footer p { margin: 0; font-size: 0.95rem; font-weight: 600; color: #64748b; }

        /* Icons */
        svg { width: 16px; height: 16px; stroke-width: 2.5; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div><h1>ਜਮੀਨ ਮਿਣਤੀ <span>(Land Calc)</span></h1></div>
        <svg style="width:22px; height:22px; opacity:0.9" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 3v18h18"/><path d="M18.7 8l-5.1 5.2-2.8-2.7L7 14.3"/></svg>
    </div>

    <!-- Main Grid -->
    <div class="grid-2">
        <div class="card c-green"><div class="label">ਕਿੱਲਾ (Acres)</div><input type="number" id="killa" class="input-val" placeholder="0" oninput="calculate('killa', this.value)"></div>
        <div class="card c-orange"><div class="label">ਵਿੱਘਾ (Bigha)</div><input type="number" id="vigha" class="input-val" placeholder="0" oninput="calculate('vigha', this.value)"></div>
    </div>
    <div class="grid-2">
        <div class="card c-orange"><div class="label">ਕਨਾਲ (Kanal)</div><input type="number" id="kanal" class="input-val" placeholder="0" oninput="calculate('kanal', this.value)"></div>
        <div class="card c-yellow"><div class="label">ਮਰਲਾ (Marla)</div><input type="number" id="marla" class="input-val" placeholder="0" oninput="calculate('marla', this.value)"></div>
    </div>
    <div class="grid-2">
        <div class="card c-purple"><div class="label">ਗਜ (Yards)</div><input type="number" id="gaj" class="input-val" placeholder="0" oninput="calculate('gaj', this.value)"></div>
        <div class="card"><div class="label">ਸਕੇਅਰ ਫੁੱਟ (Ft²)</div><input type="number" id="sqFt" class="input-val" placeholder="0" oninput="calculate('sqFt', this.value)"></div>
    </div>
    <div class="grid-2">
        <div class="card"><div class="label">ਸਕੇਅਰ ਮੀਟਰ (M²)</div><input type="number" id="sqMeter" class="input-val" placeholder="0" oninput="calculate('sqMeter', this.value)"></div>
        <div class="card"><div class="label">ਸਕੇਅਰ ਕਿ.ਮੀ. (Km²)</div><input type="number" id="sqKm" class="input-val" placeholder="0" oninput="calculate('sqKm', this.value)"></div>
    </div>

    <!-- Dimensions -->
    <div class="dims-wrapper">
        <div class="dim-box">
            <div class="dim-header"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.41 2.41 0 0 1 0-3.4l2.6-2.6a2.41 2.41 0 0 1 3.4 0Z"/></svg> ਫੁੱਟਾਂ ਰਾਹੀਂ (By Feet)</div>
            <div class="dim-row">
                <div class="dim-col"><label>ਲੰਬਾਈ (Len)</label><input type="number" id="feetLength" class="dim-input" placeholder="0" oninput="calculateFeet()"></div>
                <div class="x-sym">×</div>
                <div class="dim-col"><label>ਚੌੜਾਈ (Wid)</label><input type="number" id="feetWidth" class="dim-input" placeholder="0" oninput="calculateFeet()"></div>
            </div>
        </div>
        <div class="dim-box blue-theme">
            <div class="dim-header"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 11 3.8 11 8c0 1.25-.76 2.08-1.42 3"/></svg> ਕਰਮਾਂ ਰਾਹੀਂ (By Karams) <span style="font-weight:400; margin-left:auto; font-size:0.7rem; opacity:0.8">1K = 5.5ft</span></div>
            <div class="dim-row">
                <div class="dim-col"><label>ਲੰਬਾਈ (Len)</label><input type="number" id="karamLength" class="dim-input" placeholder="0" oninput="calculateKarams()"></div>
                <div class="x-sym">×</div>
                <div class="dim-col"><label>ਚੌੜਾਈ (Wid)</label><input type="number" id="karamWidth" class="dim-input" placeholder="0" oninput="calculateKarams()"></div>
            </div>
        </div>
    </div>

    <button class="btn-reset" onclick="resetAll()">ਸਾਫ ਕਰੋ (Reset)</button>

    <!-- Footer -->
    <div class="footer">
        <span class="name">Made By "Inderjeet Singh Talwandi Sabo"</span>
        <p>Contact - 94644-91806</p>
    </div>
</div>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
    }

    const RATES = { marla: 272.25, kanal: 5445, killa: 43560, vigha: 10890, gaj: 9, sqMeter: 10.7639, sqKm: 10763910.42, sqFt: 1, sqKaram: 30.25 };
    const inputs = { killa: document.getElementById('killa'), vigha: document.getElementById('vigha'), kanal: document.getElementById('kanal'), marla: document.getElementById('marla'), gaj: document.getElementById('gaj'), sqFt: document.getElementById('sqFt'), sqMeter: document.getElementById('sqMeter'), sqKm: document.getElementById('sqKm') };
    const karamInputs = { length: document.getElementById('karamLength'), width: document.getElementById('karamWidth') };
    const feetInputs = { length: document.getElementById('feetLength'), width: document.getElementById('feetWidth') };

    function updateAllFields(inSqFt) {
        inputs.sqFt.value = inSqFt === '' ? '' : parseFloat(inSqFt.toFixed(2));
        inputs.killa.value = inSqFt === '' ? '' : parseFloat((inSqFt / RATES.killa).toFixed(4));
        inputs.kanal.value = inSqFt === '' ? '' : parseFloat((inSqFt / RATES.kanal).toFixed(4));
        inputs.marla.value = inSqFt === '' ? '' : parseFloat((inSqFt / RATES.marla).toFixed(4));
        inputs.vigha.value = inSqFt === '' ? '' : parseFloat((inSqFt / RATES.vigha).toFixed(4));
        inputs.gaj.value = inSqFt === '' ? '' : parseFloat((inSqFt / RATES.gaj).toFixed(2));
        inputs.sqMeter.value = inSqFt === '' ? '' : parseFloat((inSqFt / RATES.sqMeter).toFixed(2));
        inputs.sqKm.value = inSqFt === '' ? '' : parseFloat((inSqFt / RATES.sqKm).toFixed(7));
    }
    function calculate(unit, value) {
        karamInputs.length.value = ''; karamInputs.width.value = ''; feetInputs.length.value = ''; feetInputs.width.value = '';
        if (value === '') { updateAllFields(''); return; }
        const numValue = parseFloat(value);
        if (isNaN(numValue)) return;
        updateAllFields(numValue * RATES[unit]);
    }
    function calculateFeet() {
        const len = parseFloat(feetInputs.length.value); const wid = parseFloat(feetInputs.width.value);
        if (!isNaN(len)) karamInputs.length.value = parseFloat((len / 5.5).toFixed(2));
        if (!isNaN(wid)) karamInputs.width.value = parseFloat((wid / 5.5).toFixed(2));
        if (feetInputs.length.value === '') karamInputs.length.value = '';
        if (feetInputs.width.value === '') karamInputs.width.value = '';
        if (!isNaN(len) && !isNaN(wid)) updateAllFields(len * wid);
    }
    function calculateKarams() {
        const len = parseFloat(karamInputs.length.value); const wid = parseFloat(karamInputs.width.value);
        if (!isNaN(len)) feetInputs.length.value = parseFloat((len * 5.5).toFixed(2));
        if (!isNaN(wid)) feetInputs.width.value = parseFloat((wid * 5.5).toFixed(2));
        if (karamInputs.length.value === '') feetInputs.length.value = '';
        if (karamInputs.width.value === '') feetInputs.width.value = '';
        if (!isNaN(len) && !isNaN(wid)) updateAllFields(len * wid * RATES.sqKaram);
    }
    function resetAll() {
        Object.values(inputs).forEach(input => input.value = '');
        karamInputs.length.value = ''; karamInputs.width.value = '';
        feetInputs.length.value = ''; feetInputs.width.value = '';
    }
</script>

</body>
</html>
